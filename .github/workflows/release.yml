name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install libraries
        run: arduino-cli lib install "FastLED" "ArduinoJson" "ESP Async WebServer"

      - name: Install vendored MyLD2410
        run: |
          mkdir -p ~/Arduino/libraries
          cp -r lib/MyLD2410 ~/Arduino/libraries/

      - name: Build firmware
        run: |
          mkdir -p /tmp/iotlamp
          cp iotlamp.ino config.h config.cpp pins.h state.h logic.h wifi_config.h.example /tmp/iotlamp/
          cp /tmp/iotlamp/wifi_config.h.example /tmp/iotlamp/wifi_config.h
          rm /tmp/iotlamp/wifi_config.h.example
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --output-dir /tmp/out /tmp/iotlamp
          cp /tmp/out/iotlamp.ino.bin lightplus-firmware.bin

      - name: Build filesystem image
        run: |
          MK=$(find ~/.arduino15/packages/esp32/tools/mklittlefs -type f -name 'mklittlefs' | head -1)
          chmod +x "$MK"
          "$MK" -c data -s 0x20000 -p 256 -b 4096 littlefs.bin

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lightplus-firmware.bin
            littlefs.bin
          generate_release_notes: true
